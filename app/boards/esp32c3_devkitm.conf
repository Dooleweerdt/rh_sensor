# ESP32C3 Specific Configuration
# -------------------------------

# Wifi settings
#--------------------------------
# Increase stack memory to avoid crashes
CONFIG_MAIN_STACK_SIZE=8192

# Enable WiFi
CONFIG_WIFI=y
CONFIG_WIFI_LOG_LEVEL_DBG=n

# Networking config
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_POSIX_API=y

# MQTT settings
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LOG_LEVEL_DBG=n

# Get IPv4 address from DHCP
CONFIG_NET_DHCPV4=y

# How long to wait for e.g. DHCP to provide an IP address (seconds)
CONFIG_NET_CONFIG_SETTINGS=n    # Disable auto-configuration...
CONFIG_NET_CONFIG_AUTO_INIT=n   # Disable auto-configuration...

# Network debug config
CONFIG_NET_LOG=n

# Enable Ethernet (required for WiFi)
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_LOG_LEVEL_DBG=n
#----------------------------------

# Required to get an IP address from DHCP
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y

# Use system heap (instead of runtime) for WiFi
CONFIG_ESP_WIFI_HEAP_SYSTEM=y
CONFIG_HEAP_MEM_POOL_SIZE=58200
